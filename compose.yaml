services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sao_dts
      POSTGRES_USER: sao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sao_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sao -d sao_dts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
