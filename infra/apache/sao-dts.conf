# SAO DTS — proxied under /sao_dts on the shared XAMPP Apache (port 80).
# iHRIS and the other htdocs apps stay untouched.
#
# Install: copy this file to C:\xampp\apache\conf\extra\sao-dts.conf and add
#     Include conf/extra/sao-dts.conf
# at the bottom of C:\xampp\apache\conf\httpd.conf.
#
# These modules must be enabled in httpd.conf (uncomment the LoadModule lines):
#   mod_proxy.so, mod_proxy_http.so, mod_proxy_wstunnel.so, mod_rewrite.so

ProxyPreserveHost On
RewriteEngine On

# WebSocket upgrade for Socket.IO realtime (requires mod_proxy_wstunnel)
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/sao_dts/socket\.io/(.*)$ ws://127.0.0.1:3001/socket.io/$1 [P,L]

# API + Socket.IO long-polling fallback
ProxyPass        /sao_dts/api/       http://127.0.0.1:3001/api/
ProxyPassReverse /sao_dts/api/       http://127.0.0.1:3001/api/
ProxyPass        /sao_dts/socket.io/ http://127.0.0.1:3001/socket.io/
ProxyPassReverse /sao_dts/socket.io/ http://127.0.0.1:3001/socket.io/

# Next.js web app (built with NEXT_BASE_PATH=/sao_dts)
ProxyPass        /sao_dts/ http://127.0.0.1:3000/sao_dts/ retry=1 timeout=600
ProxyPassReverse /sao_dts/ http://127.0.0.1:3000/sao_dts/

# Convenience: proxy bare /sao_dts to the app root. Do NOT redirect to
# /sao_dts/ here — Next canonicalizes the root to the no-slash URL (308),
# so a 301 to the slash form loops forever.
RewriteRule ^/sao_dts$ http://127.0.0.1:3000/sao_dts [P]
